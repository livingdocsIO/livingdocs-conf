---
kind: pipeline
name: default

clone:
  depth: 50

steps:
- name: eslint
  image: marcbachmann/eslint:8.0.1
  environment:
    GH_TOKEN:
      from_secret: GH_TOKEN

- name: install
  image: node:22-alpine
  commands: ["npm ci"]

- name: npm-ls
  image: node:22-alpine
  commands: ["npm ls"]

- name: test-node-22
  image: node:22-alpine
  commands: ["npm run test -s"]

- name: test-node-24
  image: node:24-alpine
  commands: ["npm run test -s"]

- name: publish
  image: livingdocs/semantic-release:v2.1.1
  environment:
    GH_TOKEN:
      from_secret: GH_TOKEN
    NPM_TOKEN:
      from_secret: NPM_TOKEN

trigger:
  event: [push]
